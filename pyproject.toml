# MiniCode 项目配置（PEP 621 + Hatch 构建）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minicode"
version = "0.1.0"
description = "Lightweight local AI Agent system"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
minicode = "minicode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minicode"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
